networks:
  app-network:

volumes:
  fiona-data:
  fiona-results:

services:
  api-service:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: 'ghcr.io/thanostsiamis/fiona/api-service:latest'
    volumes:
      - 'fiona-data:/usr/src/app/resources/data_repository'
      - 'fiona-results:/usr/src/app/resources/json_dumps'
    ports:
      - "5000:5000"
    environment:
      - FIONA_RESULT_RETENTION_DAYS=${FIONA_RESULT_RETENTION_DAYS:-7}
      - FIONA_LOG_LEVEL=${FIONA_LOG_LEVEL:-INFO}
    restart: unless-stopped
    networks:
      - app-network

  client-service:
    build:
      context: ./client_side
      dockerfile: Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* variables at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    image: 'ghcr.io/thanostsiamis/fiona/client-service:latest'
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api-service
    networks:
      - app-network
