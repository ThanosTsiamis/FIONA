networks:
  app-network:

services:
  api-service:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: 'ghcr.io/thanostsiamis/fiona/api-service:latest'
    volumes:
      - './api:/usr/src/app'
    ports:
      - "5000:5000"
    environment:
      - "FLASK_CONFIG=development"
    networks:
      - app-network

  client-service:
    build:
      context: ./client_side
      dockerfile: Dockerfile
    image: 'ghcr.io/thanostsiamis/fiona/client-service:latest'
    volumes:
      - './client_side:/usr/src/app'
      - '/usr/src/app/node_modules'
    ports:
      - "3000:3000"
    environment:
      - "NODE_ENV=development"
      # Next.js only inlines NEXT_PUBLIC_* variables into the client bundle.
      - "NEXT_PUBLIC_API_URL=http://localhost:5000"
      - "CHOKIDAR_USEPOLLING=true"
    depends_on:
      - api-service
    networks:
      - app-network
