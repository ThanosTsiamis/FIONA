networks:
  app-network:

services:
  api-service:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ghcr.io/thanostsiamis/fiona/api-service:latest
    ports:
      - "5000:5000"
    environment:
      - FLASK_CONFIG=production
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  client-service:
    build:
      context: ./client_side
      dockerfile: Dockerfile
      target: prod
    image: ghcr.io/thanostsiamis/fiona/client-service:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://api-service:5000
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - app-network
